[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "web-tools"
version = "0.1.0"
description = "Unified web search (Tavily) and fetch (Firecrawl)"
requires-python = ">=3.10"
dependencies = ["tavily-cli", "firecrawl-cli"]

[project.scripts]
web-tools = "web_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
