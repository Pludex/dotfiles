name: build packages
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-cache:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # - os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: pludex
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build packages missing from cache
        run: |
          SYSTEM=$(nix eval --raw --impure --expr 'builtins.currentSystem')

          mapfile -t NAMES < <(nix eval --json ".#ciPackages.$SYSTEM" --apply builtins.attrNames | jq -r '.[]')

          TARGETS=()
          for name in "${NAMES[@]}"; do
            attr=".#ciPackages.$SYSTEM.\"$name\""
            out=$(nix eval --raw "$attr.outPath")
            # Only asks the binary cache for narinfo, downloads nothing
            if nix path-info --store https://pludex.cachix.org "$out" >/dev/null 2>&1; then
              echo "cached, skip: $name"
            else
              echo "needs build: $name"
              TARGETS+=("$attr")
            fi
          done

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "Everything is already in cache."
            exit 0
          fi

          nix build "${TARGETS[@]}" --print-build-logs --accept-flake-config --keep-going --no-link
