name: build packages
on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-cache:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # - os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: pludex
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build all packages
        run: |
          SYSTEM=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          echo "Current runner system: $SYSTEM"

          # Walk ciPackages recursively and return each derivation's attr path
          # as a list of components. A derivation is itself an attrset, so it
          # is excluded from recursion.
          FLATTEN='
            let
              flatten = prefix: attrs:
                builtins.concatLists (
                  builtins.attrValues (
                    builtins.mapAttrs (
                      name: value:
                        let
                          path = prefix ++ [ name ];
                          isDrv = builtins.isAttrs value && (value.type or null) == "derivation";
                        in
                        if builtins.isAttrs value && !isDrv then
                          flatten path value
                        else
                          [ path ]
                    ) attrs
                  )
                );
            in
            attrs: flatten [ ] attrs
          '

          PACKAGES_JSON=$(nix eval --json ".#ciPackages.$SYSTEM" --apply "$FLATTEN")

          if [ "$PACKAGES_JSON" = "[]" ]; then
            echo "No packages found in 'ciPackages.$SYSTEM'."
            exit 0
          fi

          echo "Packages to build: $PACKAGES_JSON"

          # Each path component is JSON-quoted, e.g. "Build & Push".foo
          while IFS= read -r pkg; do
            echo "::group::Building .#ciPackages.$SYSTEM.$pkg"
            nix build ".#ciPackages.$SYSTEM.$pkg" --print-build-logs --accept-flake-config </dev/null
            echo "::endgroup::"
          done < <(echo "$PACKAGES_JSON" | jq -r '.[] | map(@json) | join(".")')
