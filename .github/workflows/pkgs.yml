name: build packages
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-cache:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # - os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: pludex
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build all packages
        run: |
          SYSTEM=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          echo "Current runner system: $SYSTEM"

          # ciPackages is a flat attrset of derivations, so attrNames is enough
          mapfile -t NAMES < <(nix eval --json ".#ciPackages.$SYSTEM" --apply builtins.attrNames | jq -r '.[]')

          if [ "${#NAMES[@]}" -eq 0 ]; then
            echo "No packages found in 'ciPackages.$SYSTEM'."
            exit 0
          fi

          echo "Packages to build: ${NAMES[*]}"

          TARGETS=()
          for name in "${NAMES[@]}"; do
            TARGETS+=(".#ciPackages.$SYSTEM.\"$name\"")
          done

          nix build "${TARGETS[@]}" --print-build-logs --accept-flake-config --keep-going --no-link
